<div class="dashboard">
  <header class="dashboard__header">
    <h1 class="dashboard__title">Visão Geral Operacional</h1>
  </header>

  @if (error$ | async; as errorMsg) {
    <div class="dashboard__error">
      <ng-icon name="lucideAlertCircle" />
      <p>{{ errorMsg }}</p>
      <button class="dashboard__retry-btn" (click)="retry()">Tentar novamente</button>
    </div>
  } @else {
    <!-- KPIs -->
    <section class="dashboard__kpis">
      @if (loading$ | async) {
        @for (kpi of [1,2,3,4]; track kpi) {
          <div class="kpi-card-skeleton">
            <z-skeleton class="size-10 rounded-lg" />
            <div class="flex flex-col gap-2 flex-1">
              <z-skeleton class="h-6 w-[60px]" />
              <z-skeleton class="h-4 w-[100px]" />
            </div>
          </div>
        }
      } @else if (kpis$ | async; as kpis) {
        <gp-kpi-card
          icon="lucideUsers"
          [value]="kpis.turnosAtivos || 0"
          label="Turnos Ativos"
          color="primary"
        />
        <gp-kpi-card
          icon="lucideTriangleAlert"
          [value]="kpis.alertasAbertos || 0"
          label="Alertas Abertos"
          color="warn"
        />
        <gp-kpi-card
          icon="lucideCheckCircle"
          [value]="kpis.checkinsUltimaHora || 0"
          label="Check-ins (1h)"
          color="success"
        />
        <gp-kpi-card
          icon="lucideGitBranchPlus"
          [value]="kpis.desviosRota || 0"
          label="Desvios 24h"
          color="warning"
        />
      }
    </section>

    <!-- Tabela -->
    <section class="dashboard__table">
      @if (loading$ | async) {
        <z-skeleton class="h-[400px] w-full rounded-lg" />
      } @else {
        <gp-dashboard-tabela
          [linhas]="(linhas$ | async) || []"
          [total]="(total$ | async) || 0"
          [pagina]="pagina()"
          [limite]="20"
          (paginaChange)="onPageChange($event)"
        />
      }
    </section>
  }
</div>
